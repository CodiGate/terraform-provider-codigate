# Release build for the Terraform Registry (runs in github.com/codigate/terraform-provider-codigate,
# see .github/workflows/release.yml). The registry wants, per version: zipped binaries named
# terraform-provider-codigate_X.Y.Z_<os>_<arch>.zip, a SHA256SUMS file, its detached GPG signature
# (SHA256SUMS.sig) made with the key registered at registry.terraform.io, and the manifest
# terraform-provider-codigate_X.Y.Z_manifest.json declaring protocol 6.
version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, '386']
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - '{{ .Env.GPG_FINGERPRINT }}'
      - --output
      - '${signature}'
      - --detach-sign
      - '${artifact}'
release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
changelog:
  disable: true
