name: release

# Each vX.Y.Z tag builds the provider with GoReleaser and attaches the zips, the registry manifest,
# SHA256SUMS and its GPG signature to a GitHub release; the Terraform Registry picks the release up
# from there (registry.terraform.io/providers/codigate/codigate). Notes come from CHANGELOG.md.
# Secrets: GPG_PRIVATE_KEY (ASCII-armoured) and GPG_PASSPHRASE, for the public key registered at
# registry.terraform.io under the codigate namespace.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: Notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="## ${TAG#v}" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section '## ${TAG#v}'"; exit 1; }
      - id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
